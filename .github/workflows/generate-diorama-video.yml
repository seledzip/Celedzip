name: 미니어처 디오라마 영상 자동 생성
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "영상 주제"
        required: true
        type: string
permissions:
  contents: read
jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg 및 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum
      - name: 패키지 설치
        run: pip install -r automation/requirements.txt
      - name: 영상 생성 + 텔레그램 전송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python -u automation/generate_diorama_video.py
