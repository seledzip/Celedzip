name: Baby Fantasy Sanctuary Auto Publisher

on:
  schedule:
    # 한국시간 기준 매일 오전 08:30 실행 (UTC 23:30)
    - cron: '30 23 * * *'
    # 한국시간 기준 매일 오후 18:30 실행 (UTC 09:30)
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Video Topic (비워두면 365일 DB에서 자동 선택됩니다)"
        required: false
        default: "auto"
        type: string

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Generate Baby Creature Sanctuary Video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic || 'auto' }}
        run: python -u automation/generate_diorama_video.py

      - name: Upload to YouTube (Unlisted Safe Mode)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u automation/upload_youtube.py

      - name: Upload Output Artifacts (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanctuary-video-outputs
          path: video_work/
          retention-days: 7
