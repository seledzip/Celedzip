name: Global Miniature ASMR Video Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video Topic (e.g., Rescuing a tiny dried corn farm with magic water)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Generate Video & Notify Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python -u automation/generate_diorama_video.py

      - name: Upload Output Artifacts (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diorama-video-outputs
          path: video_work/
          retention-days: 7
