name: 아기 환상종 보호소 쇼츠 자동 제작 및 유튜브 업로드

on:
  schedule:
    - cron: '15 22 * * *'  # 한국 시간 07:15 (오전 7시 15분)
    - cron: '15 9 * * *'   # 한국 시간 18:15 (오후 6시 15분)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg 및 필수 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests replicate google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: 영상 생성 및 유튜브 자동 업로드
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TOPIC: "auto"
        run: python automation/generate_diorama_video.py

      - name: 히스토리 기록 커밋 및 푸시
        run: |
          git config user.name "환상종 자동화 봇"
          git config user.email "bot@seledzip.local"
          git add creature_history.json
          git diff --cached --quiet || (git commit -m "🤖 아기 환상종 제작 완료 히스토리 갱신" && git pull --rebase --autostash origin main || true

